name: Release ELFIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        # Von Hand starten kann zweierlei heissen. Ohne Tag: nur bauen, um zu
        # sehen, ob beide Ziele durchlaufen. Mit Tag: wirklich veroeffentlichen -
        # der Tag entsteht dabei am Commit, auf dem der Lauf startet.
        description: "Tag fuer das Release, z. B. v1.31.0. Leer lassen heisst: nur bauen, nichts veroeffentlichen."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: StreamingBrowserElectron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install relay dependencies
        # Vier Pruefungen starten ein echtes Relay - ohne dessen Abhaengigkeit
        # werden sie uebersprungen und die Abdeckung faellt still weg.
        working-directory: sync-server
        run: npm ci --omit=dev

      - name: Typecheck
        run: npm run test

      - name: Build Windows artifacts
        run: npm run make-icon && npx electron-builder --win nsis portable --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            StreamingBrowserElectron/dist/*.exe
            StreamingBrowserElectron/dist/*.blockmap
            StreamingBrowserElectron/dist/latest.yml

  android:
    name: Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Die Fassung kommt aus dem Tag und nicht aus build.gradle. Dort stand
      # sie fest, also trug jede je gebaute APK dieselbe Nummer - und Android
      # entscheidet an genau dieser Nummer, ob eine APK neuer ist.
      #
      # versionCode muss eine steigende ganze Zahl sein: 1.38.0 wird zu 13800.
      # Damit bleibt die Reihenfolge erhalten, solange Neben- und Fehlerstand
      # unter hundert bleiben.
      - name: Fassung aus dem Tag ableiten
        id: fassung
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $name = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            $code = [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]
          } else {
            # Ein Lauf von Hand ohne Tag baut nur zur Probe. Die APK daraus
            # wird nie veroeffentlicht (der Release-Schritt laeuft dann nicht) -
            # sie soll sich aber auch nicht versehentlich ueber eine echte
            # Installation legen koennen.
            $name = "0.0.0"
            $code = 1
          }
          "name=$name" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT
          Write-Host "Fassung $name (versionCode $code)"

      # Ohne festen Schluessel gibt es kein Update: Gradle unterschreibt sonst
      # mit einem debug.keystore, den jeder Runner neu und zufaellig anlegt -
      # und Android verweigert ein Update ueber eine anders unterschriebene App.
      - name: Unterschriftsschluessel auslegen
        id: schluessel
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Host "::warning::Kein ANDROID_KEYSTORE_BASE64 hinterlegt - es wird nur eine Debug-APK gebaut. Sie laesst sich nicht als Update installieren."
            "da=nein" >> $env:GITHUB_OUTPUT
          } else {
            $pfad = Join-Path $env:RUNNER_TEMP "elfix.jks"
            [IO.File]::WriteAllBytes($pfad, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            "pfad=$pfad" >> $env:GITHUB_OUTPUT
            "da=ja" >> $env:GITHUB_OUTPUT
          }

      - name: Build signed release APK
        if: steps.schluessel.outputs.da == 'ja'
        working-directory: android
        env:
          ELFIX_KEYSTORE: ${{ steps.schluessel.outputs.pfad }}
          ELFIX_KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          ELFIX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ELFIX_KEY_PASSWORT: ${{ secrets.ANDROID_KEY_PASSWORT }}
        run: .\gradlew.bat :app:assembleRelease "-PelfixFassung=${{ steps.fassung.outputs.name }}" "-PelfixFassungNummer=${{ steps.fassung.outputs.code }}"

      - name: Build debug APK (ohne Schluessel)
        if: steps.schluessel.outputs.da != 'ja'
        working-directory: android
        run: .\gradlew.bat :app:assembleDebug "-PelfixFassung=${{ steps.fassung.outputs.name }}" "-PelfixFassungNummer=${{ steps.fassung.outputs.code }}"

      # Der Name traegt die Fassung. Die App sucht im Release nach dem Anhang,
      # der auf .apk endet - der Name selbst ist ihr gleich, aber ein Mensch,
      # der drei Dateien im Ordner liegen hat, will wissen, welche welche ist.
      - name: Prepare APK asset
        shell: pwsh
        run: |
          if ("${{ steps.schluessel.outputs.da }}" -eq "ja") {
            $quelle = "android\app\build\outputs\apk\release\app-release.apk"
            $ziel = "ELFIX-Android-${{ steps.fassung.outputs.name }}.apk"
          } else {
            $quelle = "android\app\build\outputs\apk\debug\app-debug.apk"
            $ziel = "ELFIX-Android-${{ steps.fassung.outputs.name }}-debug.apk"
          }
          Copy-Item -LiteralPath $quelle -Destination $ziel -Force

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: ELFIX-Android-*.apk

  release:
    name: Publish GitHub release
    needs:
      - windows
      - android
    # Ein Tag-Push veroeffentlicht wie bisher. Von Hand gestartet nur dann, wenn
    # ein Tag mitgegeben wurde. Bei einem Push ist `inputs` leer, die zweite
    # Bedingung also falsch - der bisherige Weg bleibt unveraendert.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: windows-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # Beim Tag-Push ist das der gepushte Tag, von Hand der eingegebene.
          # Gibt es ihn noch nicht, legt GitHub ihn an - an dem Commit, auf dem
          # dieser Lauf startet.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
