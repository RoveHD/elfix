name: Release Elflix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: StreamingBrowserElectron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run test

      - name: Build and publish Windows release
        run: npm run publish:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

  android:
    name: Android APK
    needs: windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: .\gradlew.bat :app:assembleDebug

      - name: Prepare APK asset
        shell: pwsh
        run: Copy-Item -LiteralPath android\app\build\outputs\apk\debug\app-debug.apk -Destination Elflix-Android-debug.apk -Force

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Elflix-Android-debug.apk
