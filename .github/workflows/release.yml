name: Release ELFIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        # Von Hand starten kann zweierlei heissen. Ohne Tag: nur bauen, um zu
        # sehen, ob beide Ziele durchlaufen. Mit Tag: wirklich veroeffentlichen -
        # der Tag entsteht dabei am Commit, auf dem der Lauf startet.
        description: "Tag fuer das Release, z. B. v1.31.0. Leer lassen heisst: nur bauen, nichts veroeffentlichen."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: StreamingBrowserElectron

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install relay dependencies
        # Vier Pruefungen starten ein echtes Relay - ohne dessen Abhaengigkeit
        # werden sie uebersprungen und die Abdeckung faellt still weg.
        working-directory: sync-server
        run: npm ci --omit=dev

      - name: Typecheck
        run: npm run test

      - name: Build Windows artifacts
        run: npm run make-icon && npx electron-builder --win nsis portable --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-assets
          path: |
            StreamingBrowserElectron/dist/*.exe
            StreamingBrowserElectron/dist/*.blockmap
            StreamingBrowserElectron/dist/latest.yml

  android:
    name: Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Der Werbeblocker der APK ist @adguard/tsurlfilter - dasselbe Paket wie
      # am Rechner. Es kommt aus npm und wird beim Bauen zu einer Browserdatei
      # gebuendelt (siehe android/app/build.gradle, KernBuendeln). Ohne Node
      # gibt es kein Buendel, und der Bau bricht mit genau dieser Auskunft ab.
      #
      # --ignore-scripts spart den Electron-Download: gebraucht wird hier nur
      # esbuild und das Paket selbst, und esbuild kommt ohne Installationsskript
      # aus.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      - name: Buendel-Abhaengigkeiten
        working-directory: StreamingBrowserElectron
        run: npm ci --ignore-scripts

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Die Fassung kommt aus dem Tag und nicht aus build.gradle. Dort stand
      # sie fest, also trug jede je gebaute APK dieselbe Nummer - und Android
      # entscheidet an genau dieser Nummer, ob eine APK neuer ist.
      #
      # versionCode muss eine steigende ganze Zahl sein: 1.38.0 wird zu 13800.
      # Damit bleibt die Reihenfolge erhalten, solange Neben- und Fehlerstand
      # unter hundert bleiben.
      - name: Fassung aus dem Tag ableiten
        id: fassung
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $name = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            $code = [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]
          } else {
            # Ein Lauf von Hand ohne Tag baut nur zur Probe. Die APK daraus
            # wird nie veroeffentlicht (der Release-Schritt laeuft dann nicht) -
            # sie soll sich aber auch nicht versehentlich ueber eine echte
            # Installation legen koennen.
            $name = "0.0.0"
            $code = 1
          }
          "name=$name" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT
          Write-Host "Fassung $name (versionCode $code)"

      # Ohne festen Schluessel gibt es kein Update: Gradle unterschreibt sonst
      # mit einem debug.keystore, den jeder Runner neu und zufaellig anlegt -
      # und Android verweigert ein Update ueber eine anders unterschriebene App.
      - name: Unterschriftsschluessel auslegen
        id: schluessel
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Host "::warning::Kein ANDROID_KEYSTORE_BASE64 hinterlegt - es wird nur eine Debug-APK gebaut. Sie laesst sich nicht als Update installieren."
            "da=nein" >> $env:GITHUB_OUTPUT
          } else {
            $pfad = Join-Path $env:RUNNER_TEMP "elfix.jks"
            [IO.File]::WriteAllBytes($pfad, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            "pfad=$pfad" >> $env:GITHUB_OUTPUT
            "da=ja" >> $env:GITHUB_OUTPUT
          }

      # Ein frueher, eindeutiger Befund statt eines spaeten, mehrdeutigen.
      #
      # Ohne diesen Schritt faellt ein falscher Schluessel erst bei
      # packageRelease auf - zwei Minuten spaeter, und mit einer Meldung
      # ("keystore password was incorrect"), die drei verschiedene Ursachen
      # haben kann: falsches Passwort, falscher Alias, oder eine Datei, die gar
      # kein Keystore ist, weil beim Uebertragen der Base64-Fassung etwas
      # verlorenging. Hier werden die drei auseinandergehalten.
      #
      # Nichts davon steht im Protokoll: geprueft wird ueber Rueckgabewerte,
      # und was keytool ausgibt, maskiert GitHub ohnehin, wo ein Geheimnis
      # darin vorkommt.
      - name: Schluessel pruefen
        if: steps.schluessel.outputs.da == 'ja'
        shell: pwsh
        env:
          PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $pfad = "${{ steps.schluessel.outputs.pfad }}"
          $bytes = [IO.File]::ReadAllBytes($pfad)
          Write-Host "Datei: $($bytes.Length) Bytes"
          if ($bytes.Length -lt 100) {
            Write-Host "::error::Die Datei ist zu klein fuer einen Keystore. ANDROID_KEYSTORE_BASE64 ist unvollstaendig - vermutlich wurde nur ein Teil eingefuegt."
            exit 1
          }
          # PKCS12 faengt mit einer DER-Sequenz an (0x30), JKS mit 0xFEEDFEED.
          if ($bytes[0] -eq 0x30) { $art = "PKCS12" }
          elseif ($bytes[0] -eq 0xFE) { $art = "JKS" }
          else { $art = "" }
          if (-not $art) {
            Write-Host "::error::Der entschluesselte Inhalt ist kein Keystore (beginnt mit 0x$('{0:X2}' -f $bytes[0])). In ANDROID_KEYSTORE_BASE64 steht etwas anderes, oder die Base64-Fassung wurde beim Uebertragen veraendert."
            exit 1
          }
          Write-Host "Format: $art"
          $aus = (& keytool -list -keystore $pfad -storepass $env:PASSWORT -alias $env:ALIAS 2>&1) | Out-String
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Keystore und Alias in Ordnung."
            exit 0
          }
          if ($aus -match "does not exist") {
            Write-Host "::error::Das Passwort stimmt, aber der Alias nicht: in diesem $art gibt es keinen Eintrag unter dem Namen aus ANDROID_KEY_ALIAS. 'keytool -list -keystore elfix.jks' zeigt, wie er wirklich heisst."
            exit 1
          }
          # Der haeufigste Einzelfall: beim Einfuegen ist ein Zeilenende oder
          # ein Leerzeichen mitgegangen. Das ist von einem schlicht falschen
          # Passwort nicht zu unterscheiden - ausser man probiert es. Geprueft
          # wird nur, um es benennen zu koennen; gebaut wird damit nicht, sonst
          # bliebe das Geheimnis fuer immer falsch hinterlegt.
          $beschnitten = $env:PASSWORT.Trim()
          if ($beschnitten -ne $env:PASSWORT) {
            & keytool -list -keystore $pfad -storepass $beschnitten -alias $env:ALIAS 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::In ANDROID_KEYSTORE_PASSWORT steht ein Leerzeichen oder Zeilenende zu viel - ohne das Ueberfluessige geht der Keystore auf. Das Geheimnis bitte neu einfuegen, ohne den Zeilenumbruch am Ende."
              exit 1
            }
          }
          Write-Host "::error::Die Datei ist ein gueltiges $art und laesst sich lesen, aber ANDROID_KEYSTORE_PASSWORT oeffnet sie nicht. Sie ist $($bytes.Length) Bytes gross - stimmt das mit elfix.jks auf deinem Rechner ueberein, ist die Uebertragung in Ordnung und es liegt wirklich am Passwort."
          exit 1

      - name: Build signed release APK
        if: steps.schluessel.outputs.da == 'ja'
        working-directory: android
        env:
          ELFIX_KEYSTORE: ${{ steps.schluessel.outputs.pfad }}
          ELFIX_KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          ELFIX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ELFIX_KEY_PASSWORT: ${{ secrets.ANDROID_KEY_PASSWORT }}
        run: .\gradlew.bat :app:assembleRelease "-PelfixFassung=${{ steps.fassung.outputs.name }}" "-PelfixFassungNummer=${{ steps.fassung.outputs.code }}"

      - name: Build debug APK (ohne Schluessel)
        if: steps.schluessel.outputs.da != 'ja'
        working-directory: android
        run: .\gradlew.bat :app:assembleDebug "-PelfixFassung=${{ steps.fassung.outputs.name }}" "-PelfixFassungNummer=${{ steps.fassung.outputs.code }}"

      # Ein Lauf von Hand ohne Tag ist laut der Beschreibung oben dafuer da, zu
      # sehen, ob beide Ziele durchlaufen. Bisher galt das nur fuer Windows und
      # Android nebeneinander, nicht fuer die beiden Android-Varianten - und
      # genau dazwischen sass der Fehler, an dem 1.38.0 zuerst gescheitert ist:
      # lintVital gibt es nur fuer Release, also lief Debug durch, waehrend
      # Release stehenblieb. Ein Release-Lauf braucht diesen Schritt nicht und
      # bekommt ihn deshalb auch nicht.
      - name: Debug-Bau zur Probe (nur ohne Tag)
        if: steps.schluessel.outputs.da == 'ja' && steps.fassung.outputs.name == '0.0.0'
        working-directory: android
        run: .\gradlew.bat :app:assembleDebug "-PelfixFassung=${{ steps.fassung.outputs.name }}" "-PelfixFassungNummer=${{ steps.fassung.outputs.code }}"

      # Der Name traegt die Fassung. Die App sucht im Release nach dem Anhang,
      # der auf .apk endet - der Name selbst ist ihr gleich, aber ein Mensch,
      # der drei Dateien im Ordner liegen hat, will wissen, welche welche ist.
      - name: Prepare APK asset
        shell: pwsh
        run: |
          if ("${{ steps.schluessel.outputs.da }}" -eq "ja") {
            $quelle = "android\app\build\outputs\apk\release\app-release.apk"
            $ziel = "ELFIX-Android-${{ steps.fassung.outputs.name }}.apk"
          } else {
            $quelle = "android\app\build\outputs\apk\debug\app-debug.apk"
            $ziel = "ELFIX-Android-${{ steps.fassung.outputs.name }}-debug.apk"
          }
          Copy-Item -LiteralPath $quelle -Destination $ziel -Force

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-release-assets
          path: ELFIX-Android-*.apk


  # ---------------------------------------------------------------------------
  # Das Watchparty-Relay als eigenstaendiges Programm.
  #
  # Bis hierher war es ein Ordner mit Quelltext: Node installieren, npm ci,
  # systemd-Vorlage von Hand anpassen. Wer die Watchparty benutzen will, muss
  # das Relay betreiben - und das war die Huerde.
  #
  # Gebaut wird auf beiden Plattformen dieselbe Sache (siehe sync-server/bauen.js):
  # esbuild buendelt, Node macht daraus einen SEA-Blob, postject spritzt ihn in
  # eine Kopie der Node-Binaerdatei. Heraus kommt eine Datei ohne Abhaengigkeiten.
  #
  # Die Fassung kommt aus dem Tag und wird hineingebacken - die
  # Selbstaktualisierung misst sich daran.
  # ---------------------------------------------------------------------------
  relay-windows:
    name: Relay (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      # esbuild kommt aus den Abhaengigkeiten der Desktop-App - dieselbe
      # Fassung, mit der auch der Android-Kern gebuendelt wird. --ignore-scripts
      # spart den Electron-Download: gebraucht wird hier nur esbuild.
      - name: Buendel-Abhaengigkeiten
        working-directory: StreamingBrowserElectron
        run: npm ci --ignore-scripts

      # Und die des Relays selbst: esbuild buendelt `ws` mit hinein und muss es
      # dafuer finden. Oertlich lag es laengst da, auf einem frischen Runner
      # nicht - der Bau brach mit "Could not resolve ws" ab.
      - name: Relay-Abhaengigkeiten
        working-directory: sync-server
        run: npm ci --omit=dev

      - name: Fassung aus dem Tag ableiten
        id: fassung
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if ($tag -match '^v?(\d+\.\d+\.\d+)') { $name = $Matches[1] } else { $name = "0.0.0" }
          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "Relay-Fassung $name"

      - name: Relay bauen
        working-directory: sync-server
        run: node bauen.js --fassung ${{ steps.fassung.outputs.name }}

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: relay-windows-assets
          path: sync-server/dist/ELFIX-Relay-*.exe

  relay-linux:
    name: Relay (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      - name: Buendel-Abhaengigkeiten
        working-directory: StreamingBrowserElectron
        run: npm ci --ignore-scripts

      # Und die des Relays selbst: esbuild buendelt `ws` mit hinein und muss es
      # dafuer finden. Oertlich lag es laengst da, auf einem frischen Runner
      # nicht - der Bau brach mit "Could not resolve ws" ab.
      - name: Relay-Abhaengigkeiten
        working-directory: sync-server
        run: npm ci --omit=dev

      - name: Fassung aus dem Tag ableiten
        id: fassung
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME=$(echo "$TAG" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          [ -z "$NAME" ] && NAME="0.0.0"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Relay-Fassung $NAME"

      # Mit --deb: dpkg-deb liegt auf jedem Ubuntu-Runner. Das Paket richtet
      # den Dienst gleich ein und laeuft damit auf allem, was Debian-basiert
      # ist - Debian, Ubuntu, Linux Mint.
      - name: Relay und Paket bauen
        working-directory: sync-server
        run: node bauen.js --fassung ${{ steps.fassung.outputs.name }} --deb

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: relay-linux-assets
          path: |
            sync-server/dist/ELFIX-Relay-*-linux-*
            sync-server/dist/ELFIX-Relay-*.deb

  release:
    name: Publish GitHub release
    needs:
      - windows
      - android
      - relay-windows
      - relay-linux
    # Ein Tag-Push veroeffentlicht wie bisher. Von Hand gestartet nur dann, wenn
    # ein Tag mitgegeben wurde. Bei einem Push ist `inputs` leer, die zweite
    # Bedingung also falsch - der bisherige Weg bleibt unveraendert.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: windows-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          # Beim Tag-Push ist das der gepushte Tag, von Hand der eingegebene.
          # Gibt es ihn noch nicht, legt GitHub ihn an - an dem Commit, auf dem
          # dieser Lauf startet.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
