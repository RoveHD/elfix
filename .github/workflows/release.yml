name: Release ELFIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        # Von Hand starten kann zweierlei heissen. Ohne Tag: nur bauen, um zu
        # sehen, ob beide Ziele durchlaufen. Mit Tag: wirklich veroeffentlichen -
        # der Tag entsteht dabei am Commit, auf dem der Lauf startet.
        description: "Tag fuer das Release, z. B. v1.31.0. Leer lassen heisst: nur bauen, nichts veroeffentlichen."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: StreamingBrowserElectron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install relay dependencies
        # Vier Pruefungen starten ein echtes Relay - ohne dessen Abhaengigkeit
        # werden sie uebersprungen und die Abdeckung faellt still weg.
        working-directory: sync-server
        run: npm ci --omit=dev

      - name: Typecheck
        run: npm run test

      - name: Build Windows artifacts
        run: npm run make-icon && npx electron-builder --win nsis portable --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            StreamingBrowserElectron/dist/*.exe
            StreamingBrowserElectron/dist/*.blockmap
            StreamingBrowserElectron/dist/latest.yml

  android:
    name: Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: .\gradlew.bat :app:assembleDebug

      - name: Prepare APK asset
        shell: pwsh
        run: Copy-Item -LiteralPath android\app\build\outputs\apk\debug\app-debug.apk -Destination ELFIX-Android-debug.apk -Force

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: ELFIX-Android-debug.apk

  release:
    name: Publish GitHub release
    needs:
      - windows
      - android
    # Ein Tag-Push veroeffentlicht wie bisher. Von Hand gestartet nur dann, wenn
    # ein Tag mitgegeben wurde. Bei einem Push ist `inputs` leer, die zweite
    # Bedingung also falsch - der bisherige Weg bleibt unveraendert.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: windows-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # Beim Tag-Push ist das der gepushte Tag, von Hand der eingegebene.
          # Gibt es ihn noch nicht, legt GitHub ihn an - an dem Commit, auf dem
          # dieser Lauf startet.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
