name: Watchparty CI probe
on:
  push:
    branches: [codex/watchparty-ci-probe]
permissions:
  contents: read
jobs:
  watchparty:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: StreamingBrowserElectron/package-lock.json
      - run: npm ci
        working-directory: StreamingBrowserElectron
      - run: npm ci --omit=dev
        working-directory: sync-server
      - name: Actual Windows paths
        run: |
          Write-Output "TEMP=$env:TEMP"
          Write-Output "TMP=$env:TMP"
          Write-Output "USERPROFILE=$env:USERPROFILE"
          Write-Output "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
      - name: Build native RTX Video component
        working-directory: StreamingBrowserElectron
        run: npm run build:rtx
      - name: Complete Node regression suite
        working-directory: StreamingBrowserElectron
        run: npm test
      - name: Preceding Electron regression tests
        working-directory: StreamingBrowserElectron
        run: |
          foreach ($test in @('verifizierung-electrontest.js','direktelectrontest.js','spielerquellenelectrontest.js','spielerbedienung-electrontest.js','securityelectrontest.js','spielerchatelectrontest.js','spielerbarriereelectrontest.js')) {
            & .\node_modules\.bin\electron.cmd "tests/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-CimInstance Win32_Process | Where-Object Name -eq 'electron.exe' | Select-Object ProcessId,ParentProcessId,CreationDate,CommandLine | ConvertTo-Json -Depth 4
      - name: Three complete app instances
        run: node tests/watchparty-drei-pc-electrontest.js
        working-directory: StreamingBrowserElectron
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ELFIX_THREE_PC_TRACE: '1'
      - name: Remaining Electron processes
        if: always()
        run: Get-CimInstance Win32_Process | Where-Object Name -eq 'electron.exe' | Select-Object ProcessId,ParentProcessId,CreationDate,CommandLine | ConvertTo-Json -Depth 4
      - name: Keep isolated fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watchparty-fixture-logs
          path: |
            ${{ runner.temp }}/elfix-three-pc-*/*.log
            ${{ runner.temp }}/elfix-three-pc-*/diagnostics.json
            ${{ runner.temp }}/elfix-three-pc-*/*-processes.json
            ${{ runner.temp }}/elfix-three-pc-*/pc*/chromium-trace.json
