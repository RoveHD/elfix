plugins {
    id "com.android.application"
}

/*
 * Der gemeinsame Kern.
 *
 * Die Geschaeftslogik von ELFIX steht einmal, in JavaScript, unter
 * StreamingBrowserElectron. Android hat sie bisher ein zweites Mal in Java
 * gehabt - 37 gleichnamige Funktionen, von Hand nachgezogen und laengst
 * auseinandergelaufen. Statt sie weiter zu pflegen, kopiert dieser Schritt die
 * Module unveraendert in die Assets; die App laedt sie zur Laufzeit in einen
 * unsichtbaren WebView (siehe Kern.java).
 *
 * Kopiert wird beim Bauen, nicht von Hand: so kann eine Aenderung am Desktop
 * gar nicht erst vergessen werden. Die Liste ist bewusst ausdruecklich - es
 * wandert nur mit, was ohne Electron und ohne Node auskommt.
 */
def kernQuelle = file("$rootDir/../StreamingBrowserElectron")
def kernModule = [
    "src/titel.js",
    "src/fortschritt.js",
    "src/messung.js",
    "src/adblock-kosmetik.js",
    "src/fortschritt-proben.js",
    "src/begruendung.js",
    "src/empfehlung.js",
    "src/metadaten.js",
    "src/statistik.js",
    "src/discover.js",
    "src/taste.js",
    "src/watchparty.js",
    "src/watchparty-sync.js",
    "src/watchparty-raeume.js",
    "src/youtube.js",
    "src/youtube-sync.js",
    "src/voe-qualitaet.js",
    "src/fassung.js",
    "src/marken.js",
    "src/geraete.js",
    "src/geraete-schluessel.js",
    "src/geraete-stand.js",
    "shared/provider-model.js",
    "shared/bildausschnitt.js"
]

tasks.register("kernKopieren", Copy) {
    description = "Kopiert die gemeinsamen ELFIX-Module aus der Desktop-App in die Assets."
    group = "build"
    from(kernQuelle) {
        kernModule.each { include it }
        eachFile { it.path = it.sourceName }
    }
    into layout.buildDirectory.dir("kern-assets/kern/module")
    includeEmptyDirs = false

    doFirst {
        if (!kernQuelle.isDirectory()) {
            throw new GradleException(
                "Die Desktop-App wurde unter ${kernQuelle} nicht gefunden. " +
                "Der gemeinsame Kern kann ohne sie nicht gebaut werden.")
        }
        kernModule.each { pfad ->
            if (!new File(kernQuelle, pfad).isFile()) {
                throw new GradleException("Kern-Modul fehlt: ${pfad}")
            }
        }
    }
}

/*
 * Die Fassung kommt von aussen, nicht aus dieser Datei.
 *
 * Solange sie hier stand, trug jede je gebaute APK dieselbe Nummer. Das faellt
 * nicht auf, solange von Hand installiert wird - fuer ein Update ist es das
 * Ende: Android entscheidet an `versionCode`, ob eine APK neuer ist, und die
 * App kann an `versionName` gar nicht erst ablesen, ob es etwas Neueres gibt.
 *
 * Gesetzt wird beides beim Bauen aus dem Tag (siehe .github/workflows/release.yml).
 * Die Werte hier sind nur der Rueckfall fuer den Bau von Hand.
 */
def fassungName = (project.findProperty("elfixFassung") ?: "0.0.0").toString()
def fassungNummer = (project.findProperty("elfixFassungNummer") ?: "1").toString().toInteger()

/*
 * Der Schluessel, mit dem die APK unterschrieben wird.
 *
 * Bis hierher gab es keinen: der Workflow baute `assembleDebug`, und Gradle
 * unterschreibt dann mit `~/.android/debug.keystore`. Den legt jede Maschine
 * bei Bedarf selbst an - mit einem *zufaelligen* Schluessel. Auf einem
 * GitHub-Runner, der nach jedem Lauf verschwindet, heisst das: jedes Release
 * trug eine andere Unterschrift, und Android verweigert ein Update ueber eine
 * anders unterschriebene App. Deshalb musste bisher jedes Mal deinstalliert
 * werden - und mit dem Deinstallieren ging der ganze oertliche Bestand.
 *
 * Der Schluessel gehoert nicht ins Repository. Er kommt als Geheimnis herein;
 * wer ihn nicht hat, kann keine APK bauen, die sich ueber eine bestehende
 * legt.
 */
def schluesselDatei = System.getenv("ELFIX_KEYSTORE") ?: project.findProperty("elfixKeystore")
def schluesselDa = schluesselDatei != null && new File(schluesselDatei.toString()).isFile()

android {
    namespace "local.elflix.android"
    compileSdk 35

    defaultConfig {
        applicationId "local.elflix.android"
        minSdk 26
        targetSdk 35
        versionCode fassungNummer
        versionName fassungName
    }

    signingConfigs {
        if (schluesselDa) {
            elfix {
                storeFile file(schluesselDatei.toString())
                storePassword System.getenv("ELFIX_KEYSTORE_PASSWORT")
                    ?: project.findProperty("elfixKeystorePasswort")
                keyAlias System.getenv("ELFIX_KEY_ALIAS")
                    ?: project.findProperty("elfixKeyAlias")
                keyPassword System.getenv("ELFIX_KEY_PASSWORT")
                    ?: project.findProperty("elfixKeyPasswort")
            }
        }
    }

    buildTypes {
        release {
            // Ohne Schluessel bleibt die APK unsigniert. Das ist kein stiller
            // Rueckfall auf den Debug-Schluessel: eine unsignierte APK laesst
            // sich gar nicht erst installieren und faellt sofort auf, waehrend
            // eine falsch signierte erst beim naechsten Update auffiele.
            if (schluesselDa) signingConfig signingConfigs.elfix
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir("kern-assets")
        }
    }
}

/*
 * Eine Release-APK ohne Schluessel ist keine, die jemand installieren kann.
 * Also lieber hier abbrechen als eine Datei ausliefern, an der es erst auf dem
 * Telefon scheitert.
 */
tasks.matching { it.name == "assembleRelease" }.configureEach {
    doFirst {
        if (!schluesselDa) {
            throw new GradleException(
                "Kein Unterschriftsschluessel. Erwartet wird der Pfad zur Keystore-Datei in " +
                "ELFIX_KEYSTORE (Umgebung) oder -PelfixKeystore=... . " +
                "Ohne ihn laesst sich die APK nicht installieren und erst recht nicht aktualisieren. " +
                "Fuer einen Bau zum Ausprobieren: assembleDebug.")
        }
    }
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn "kernKopieren"
}

/*
 * Die Probenliste der Fortschrittsregel wandert mit.
 *
 * Sie ist keine Bibliothek, sondern eine Pruefung - und genau deshalb gehoert
 * sie ins Paket: nur so laesst sich auf dem Geraet selbst zeigen, dass dort
 * dasselbe herauskommt wie am Rechner. Ohne sie waere "teilt sich die Logik"
 * eine Behauptung.
 */
tasks.register("probenKopieren", Copy) {
    description = "Kopiert die Faelle der Fortschrittsregel in die Assets."
    group = "build"
    from(new File(kernQuelle, "tests")) {
        include "fortschritt-proben.json"
    }
    into layout.buildDirectory.dir("kern-assets/kern")
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn "probenKopieren"
}

/*
 * Die einzige Abhaengigkeit - und sie ersetzt etwas, das Electron mitbringt.
 *
 * Am Rechner spielt ELFIX seine Skripte in jeden Rahmen einer Seite ein, auch
 * in den cross-origin-Rahmen des Hosters. Genau dort liegt das Video: die
 * Intromarken brauchen seine Zeitachse, die Qualitaetswahl seinen Player, und
 * die Messung zaehlt dort die wirklich gespielten Sekunden.
 *
 * WebView.evaluateJavascript erreicht nur das Hauptdokument. androidx.webkit
 * bringt die beiden Gegenstuecke mit: addDocumentStartJavaScript spielt beim
 * Start *jedes* Dokuments ein, addWebMessageListener ist der Rueckkanal.
 * Beides ist AndroidX und kein Kunstgriff - ohne beides waeren drei Funktionen
 * des Rechners auf Android schlicht nicht erreichbar.
 */
dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    /*
     * Fuer den FileProvider.
     *
     * Er kaeme ueber webkit ohnehin mit herein, aber eine Abhaengigkeit, auf
     * die eine Zeile Code unmittelbar zugreift, gehoert hingeschrieben - sonst
     * verschwindet sie mit dem naechsten Versionssprung von webkit.
     *
     * Gebraucht wird er genau einmal: um dem Paketinstaller die
     * heruntergeladene APK zu reichen. Seit Android 7 geht das nicht mehr ueber
     * einen file://-Verweis.
     */
    implementation "androidx.core:core:1.13.1"
}
