<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: https: http:; connect-src https: http:; worker-src blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<title>ELFIX Player</title>
<!-- Skripte kommen ausschliesslich aus der App. Fremde Adressen sind nur
     fuer Medienabrufe erlaubt; Navigation, Unterfenster und IPC sind separat
     auf die lokale Playerseite beschraenkt. -->

<style>
  /* Der eigene Player. Dunkel, weil davor ein Film laeuft, und ohne jede
     Verzierung: alles, was hier steht, ist entweder eine Angabe oder ein
     Knopf. Die Farbe ist die der Oberflaeche (#3D92FF). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05070c; color: #fff;
    font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; cursor: default;
  }
  #buehne { position: fixed; inset: 0; }
  video { width: 100%; height: 100%; background: #05070c; outline: none; }

  /* Kopf und Leiste blenden sich zusammen aus - sie gehoeren zur Bedienung,
     nicht zum Film. */
  .schicht {
    position: fixed; left: 0; right: 0; padding: 14px 18px;
    transition: opacity 220ms ease;
  }
  .schicht.weg { opacity: 0; pointer-events: none; }
  body:has(#leiste.weg),
  body:has(#leiste.weg) * { cursor: none !important; }
  #kopf {
    top: 0; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0));
  }
  #titel { font-weight: 700; font-size: 15px; }
  #hoster { color: rgba(255, 255, 255, 0.6); font-size: 12px; }
  #leiste {
    bottom: 0; display: flex; flex-direction: column; gap: 8px;
    background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.82));
  }
  .reihe { display: flex; align-items: center; gap: 12px; }
  .luecke { flex: 1; }

  button {
    border: 0; background: transparent; color: #fff; cursor: pointer;
    font: inherit; padding: 6px 10px; border-radius: 10px;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button:focus-visible { outline: 2px solid #3D92FF; }
  #zu { margin-left: auto; }

  .zeit { font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, 0.8); font-size: 13px; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.22); cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #3D92FF; border: 0;
  }

  /*
   * Drei Zonen statt einer Farbe.
   *
   * Der Balken war durchgehend gleich hell - man sah weder, wie weit man ist,
   * noch wieviel schon geladen wurde. Beides steht jetzt darin:
   *
   *   gespielt   der Weg hinter dem Knauf, in der Farbe des Knaufs
   *   geladen    was der Puffer schon hat, heller als der Rest
   *   Rest       die Spur
   *
   * Gezeichnet wird das als Verlauf im Hintergrund und nicht als drei
   * Elemente: ein <input type="range"> bleibt damit ein Schieberegler, den man
   * mit den Pfeiltasten bedienen kann. Die beiden Anteile setzt das Skript als
   * Variablen (siehe reglerFaerben).
   */
  #regler {
    flex: 1;
    background:
      var(--skip-abschnitte, linear-gradient(transparent, transparent)),
      linear-gradient(to right, #3D92FF 0 var(--gespielt, 0%), transparent var(--gespielt, 0%)),
      linear-gradient(to right, rgba(255, 255, 255, 0.42) 0 var(--geladen, 0%), transparent var(--geladen, 0%)),
      rgba(255, 255, 255, 0.22);
  }
  #lautstaerke { width: 96px; }
  #spulVorschau {
    position: fixed; z-index: 20; pointer-events: none; max-width: calc(100vw - 24px);
    padding: 5px; border-radius: 10px; background: rgba(12, 16, 24, .96);
    border: 1px solid rgba(255, 255, 255, .2); box-shadow: 0 6px 24px #0008;
    text-align: center; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #spulVorschau canvas { display: block; width: 240px; max-width: 100%; height: auto; border-radius: 6px; }
  #spulVorschauText { display: block; padding: 5px 8px; }

  /*
   * Das aufgeklappte Menue kommt vom Betriebssystem, nicht von dieser Seite.
   *
   * Mit `background: rgba(255,255,255,.12)` und `color: #fff` sah der
   * geschlossene Knopf richtig aus - und das aufgeklappte Menue war weisse
   * Schrift auf weissem Grund, weil die halbdurchsichtige Farbe dort auf
   * Weiss faellt. `color-scheme: dark` sagt dem System, in welcher Welt es
   * zeichnen soll; die deckenden Farben an `option` sind der Guertel dazu.
   */
  /*
   * Das Auswahlfeld der Seite.
   *
   * Vorher stand hier ein <select>. Sein aufgeklapptes Menue zeichnet das
   * System und nicht die Seite - in einer WebContentsView sass es daneben, es
   * verschwand, sobald sich die Leiste ausblendete, und ein Steuerkreuz kam
   * nie hinein. Dieses Menue gehoert der Seite: es haelt die Leiste wach,
   * laesst sich mit den Pfeiltasten bedienen und sieht auf jedem Geraet gleich
   * aus - wie die Blende auf Android.
   */
  .wahl { position: relative; flex: 0 0 auto; }
  .wahlKnopf {
    background: #1E242E; color: #fff; border: 0;
    padding: 6px 10px; border-radius: 10px; font: inherit;
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    max-width: 190px;
  }
  .wahlKnopf:hover { background: #27303C; }
  .wahlKnopf:focus-visible { outline: 2px solid #3D92FF; }
  .wahlText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wahlPfeil { font-size: 9px; opacity: 0.7; }
  .wahl.auf .wahlKnopf { background: #27303C; }
  .wahl.aus .wahlKnopf { opacity: 0.4; cursor: default; }
  .wahlMenue {
    position: absolute; bottom: calc(100% + 8px); right: 0; z-index: 40;
    min-width: 172px; max-width: min(320px, 80vw);
    max-height: min(52vh, 420px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 3px;
    padding: 6px; border-radius: 12px;
    background: rgba(8, 11, 18, 0.97);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
  }
  .wahlKopf {
    padding: 4px 10px 6px; font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; color: rgba(255, 255, 255, 0.5);
  }
  .wahlMenue button {
    display: flex; align-items: center; gap: 8px; text-align: left;
    padding: 9px 10px; border-radius: 9px; background: rgba(255, 255, 255, 0.06);
    white-space: nowrap;
  }
  .wahlMenue button:hover { background: rgba(255, 255, 255, 0.16); }
  .wahlMenue button:focus-visible { outline: 2px solid #3D92FF; outline-offset: -2px; }
  .wahlMenue button.laeuft { background: rgba(61, 146, 255, 0.3); font-weight: 700; }
  .wahlMenue button[disabled] { opacity: 0.38; cursor: default; }
  .wahlHaken { width: 12px; opacity: 0.9; }

  /* Der Strich zwischen "diese Folge" und "die naechste". */
  .trenner {
    width: 1px; height: 22px; margin: 0 6px;
    background: rgba(255, 255, 255, 0.2);
    flex: 0 0 auto;
  }

  /*
   * Ein Schalter zeigt seinen Zustand - und zwar im Wort.
   *
   * Die Farbe allein genuegt nicht: sie sagt nur "irgendwie anders", nicht
   * "aus". Deshalb steht "Autoplay an" oder "Autoplay aus" darin, und der
   * blasse Grund kommt als zweites Zeichen dazu.
   */
  /*
   * Die Karte zur naechsten Folge - so gross, dass man sie trifft, und so
   * weit rechts, dass sie nichts verdeckt, worauf es ankommt.
   */
  #weiterKnopf {
    position: fixed; right: 26px; bottom: 104px; z-index: 30;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    min-width: 190px; max-width: 340px;
    padding: 12px 18px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 12px;
    background: rgba(12, 16, 24, 0.86);
    color: #fff; text-align: left; cursor: pointer;
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.5);
    transition: opacity .22s ease, transform .22s ease, background .14s ease;
  }
  #weiterKnopf:hover { background: rgba(24, 32, 46, 0.94); }
  #weiterKnopf[hidden] { display: none; }
  .weiterKnopfOben { font: 800 15px/1.2 system-ui, sans-serif; }
  .weiterKnopfTitel {
    font: 500 12px/1.3 system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.72);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%;
  }
  /* Sie geht mit der Leiste - dieselbe Klasse, dieselbe Bewegung. */
  #weiterKnopf.weg { opacity: 0; pointer-events: none; transform: translateY(8px); }

  #autoKnopf { font-weight: 700; }
  #autoKnopf.aus { opacity: 0.5; font-weight: 400; }

  /* Der Chat ist eine linke Schublade wie bei einem Livestream. Er liegt ueber
     dem Bild und verkleinert es nicht; auf schmalen Fenstern bleibt genug Bild
     uebrig, weil die Schublade nur fast die ganze Breite einnimmt. */
  #chatKnopf {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 45;
    width: 30px; min-height: 48px; padding: 8px 0; border-radius: 0 12px 12px 0;
    font-size: 25px; line-height: 1;
    border: 1px solid rgba(255,255,255,.2); border-left: 0;
    background: rgba(8,11,18,.92); transition: opacity 220ms ease;
  }
  body:has(#leiste.weg) #chatKnopf { opacity: 0; pointer-events: none; }
  #chatKnopf[data-ungelesen]::after {
    content: attr(data-ungelesen); position: absolute; top: -5px; right: -5px;
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
    background: #3D92FF; color: #fff; font: 700 10px/16px system-ui, sans-serif;
    text-align: center;
  }
  #chatPanel {
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 50;
    width: min(380px, 88vw); padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    background: #080b12; box-shadow: 18px 0 54px rgba(0, 0, 0, .58);
  }
  .chatKopf { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .chatKopf strong { flex: 1; }
  #chatStatus { color: rgba(255,255,255,.72); font-size: 12px; font-weight: 500; }
  #chatListe {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
    gap: 0; padding-right: 3px; user-select: text;
  }
  .chatNachricht { display: flex; align-items: baseline; gap: 6px; padding: 7px 2px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .chatName { color: #91c4ff; font-size: 12px; font-weight: 700; }
  .chatText { flex: 1; min-width: 0; color: rgba(255,255,255,.92); white-space: pre-wrap; overflow-wrap: anywhere; }
  .chatZeit { flex: 0 0 auto; color: rgba(255,255,255,.5); font-size: 11px; font-variant-numeric: tabular-nums; }
  #chatForm { display: flex; gap: 8px; margin: 0 -14px -14px; padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,.13); background: #0b0f18; }
  #chatEingabe {
    flex: 1; min-width: 0; resize: none; min-height: 38px; max-height: 96px;
    padding: 9px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 10px;
    background: rgba(255,255,255,.09); color: #fff; font: inherit; user-select: text;
  }
  #chatEingabe:focus-visible { outline: 2px solid #3D92FF; outline-offset: 1px; }
  #chatSenden { background: #3D92FF; font-weight: 700; }
  #chatSenden[disabled] { opacity: .45; cursor: default; }
  @media (max-width: 560px) { #chatPanel { width: min(100vw, 420px); } }
  /*
   * Die Teilnehmer der Runde - oben in der Mitte, ueber dem Bild.
   *
   * Dieselbe Leiste, die im Hoster-Rahmen eingespritzt wird
   * (watchpartyLeisteScript in main.js): dort muss sie aus lauter einzelnen
   * Stileigenschaften bestehen, weil viele Hoster eingebettete Stile
   * verbieten. Hier ist es die eigene Seite, also steht sie hier, wo Stile
   * hingehoeren - das Aussehen ist absichtlich dasselbe.
   *
   * Sie gehoert zu den Schichten: sie kommt und geht mit Kopf und Leiste. Ein
   * Streifen, der ueber einem laufenden Film dauerhaft stehenbleibt, stoert
   * genau so wie eine Bedienleiste.
   */
  #runde {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 5px 8px; border-radius: 999px;
    background: rgba(10, 14, 22, 0.82);
    font: 500 12px/1.35 system-ui, sans-serif;
    max-width: 92vw; overflow: hidden; pointer-events: none;
    transition: opacity 220ms ease;
  }
  #runde.weg { opacity: 0; }
  #runde[hidden] { display: none !important; }
  .rundeMarke {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    background: rgba(255, 255, 255, 0.08);
  }
  .rundeMarke.ich { background: rgba(255, 255, 255, 0.16); }
  .rundeZeichen { font-size: 9px; color: #22c55e; }
  .rundeMarke.haelt .rundeZeichen { color: #f5b84b; }
  .rundeMarke.fuehrt .rundeName { font-weight: 700; }
  .rundeHost { font-size: 9px; opacity: 0.8; }
  .rundeUhr { opacity: 0.85; font-variant-numeric: tabular-nums; }

  /* Die Mitte: Puffern und Fehler. Beide liegen an derselben Stelle, weil sie
     dasselbe beantworten - "warum sehe ich nichts?" */
  #mitte {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  /* Der Knopf in der Mitte. Er geht mit den anderen Schichten weg (siehe
     schichten in spieler.js) und tritt zurueck, sobald etwas Wichtigeres in der
     Mitte steht: waehrend des Puffers und ueber einem Fehlerkasten. */
  #mitteSpielen {
    position: absolute; pointer-events: auto;
    width: 76px; height: 76px; padding: 0; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 27px; line-height: 1;
    background: rgba(10, 14, 22, 0.58);
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.45);
    transition: opacity 220ms ease, background 160ms ease, transform 160ms ease;
  }
  #mitteSpielen:hover { background: rgba(10, 14, 22, 0.86); transform: scale(1.06); }
  #mitteSpielen.weg { opacity: 0; pointer-events: none; }
  #spielen { position: relative; width: 40px; min-width: 40px; height: 36px; padding: 0; display: grid; place-items: center; }
  #spielen svg, #mitteSpielen svg { display: block; width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
  #mitteSpielen svg { width: 32px; height: 32px; }
  #spielen[aria-busy="true"]::after, #mitteSpielen[aria-busy="true"]::after {
    content: ""; position: absolute; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2); border-top-color: #3D92FF;
    animation: dreh 900ms linear infinite; pointer-events: none;
  }
  #mitteSpielen[aria-busy="true"]::after { width: 54px; height: 54px; }
  @media (prefers-reduced-motion: reduce) {
    #spielen[aria-busy="true"]::after, #mitteSpielen[aria-busy="true"]::after { animation: none; }
  }

  #puffer {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.22); border-top-color: #3D92FF;
    animation: dreh 900ms linear infinite;
  }
  #warteAufAlle {
    position: absolute; transform: translateY(54px); padding: 7px 11px; border-radius: 999px;
    background: rgba(10, 14, 22, .86); color: rgba(255,255,255,.88); font-size: 13px;
    box-shadow: 0 10px 28px rgba(0,0,0,.36);
  }
  @keyframes dreh { to { transform: rotate(360deg); } }
  #fehler {
    pointer-events: auto; max-width: 460px; padding: 22px 24px; border-radius: 18px;
    background: rgba(10, 14, 22, 0.94); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    text-align: center;
  }
  #fehler h2 { margin: 0 0 8px; font-size: 17px; }
  #fehler p { margin: 0 0 16px; color: rgba(255, 255, 255, 0.72); font-size: 13px; }
  #fehler button {
    background: #3D92FF; font-weight: 700; padding: 10px 16px;
  }
  button.betont { background: #3D92FF; font-weight: 700; }
  button.betont:hover { background: #2f7fe6; }

  /* Die Folgenliste */
  #folgenPanel {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 92vw);
    background: rgba(8, 11, 18, 0.96); box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
    display: flex; flex-direction: column; padding: 14px 14px 18px; gap: 10px;
  }
  .panelKopf { display: flex; align-items: center; gap: 10px; }
  .panelKopf strong { flex: 1; font-size: 15px; }
  .reiter { display: flex; flex-wrap: wrap; gap: 6px; }
  .reiter button { padding: 5px 10px; background: rgba(255, 255, 255, 0.1); font-size: 13px; }
  .reiter button.aktiv { background: #3D92FF; font-weight: 700; }
  /* `overflow-y` setzt das automatische Mindestmass auf null. Ohne die feste
     Untergrenze schob die aufgeklappte Spoiler-Box die Folgenliste auf die
     Hoehe null - man sah die Schalter und keine einzige Folge mehr. */
  .liste { flex: 1 1 auto; min-height: 132px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .liste .zeile { display: flex; align-items: stretch; gap: 4px; }
  .liste .zeile > button.folge {
    flex: 1; display: flex; gap: 10px; align-items: baseline; text-align: left;
    padding: 9px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.06);
  }
  .liste .zeile > button.folge:hover { background: rgba(255, 255, 255, 0.16); }
  .liste .zeile > button.folge.laeuft { background: rgba(61, 146, 255, 0.28); }
  .liste .zeile > button.folge[disabled] { opacity: 0.38; cursor: default; }
  /* Der Haken ist ein eigener Knopf und darf deshalb nicht im Folgenknopf
     stehen - ein Knopf im Knopf ist keiner. */
  .hakenKnopf {
    flex: 0 0 auto; padding: 0 11px; border-radius: 10px; font-size: 13px;
    background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.45);
  }
  .hakenKnopf:hover { background: rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.85); }
  .hakenKnopf.an { color: #9de4bc; }
  .folge-gesehen { margin-left: auto; color: #9de4bc; font-size: 12px; white-space: nowrap; }
  .staffelAktion { display: flex; gap: 6px; }
  .staffelAktion button {
    padding: 5px 10px; font-size: 12px; background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.78);
  }
  .staffelAktion button:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
  .spoilerBox {
    flex: 0 1 auto; max-height: 46%; overflow-y: auto;
    border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 8px; font-size: 13px;
  }
  .spoilerBox > summary { cursor: pointer; color: rgba(255, 255, 255, 0.78); padding: 2px 0; }
  .spoilerZeile { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; }
  .spoilerZeile input { margin-top: 3px; flex: 0 0 auto; }
  .spoilerZeile strong { display: block; font-size: 13px; }
  .spoilerZeile small { display: block; color: rgba(255, 255, 255, 0.6); font-size: 12px; line-height: 1.45; }
  .liste .nummer { color: rgba(255, 255, 255, 0.62); font-variant-numeric: tabular-nums; min-width: 58px; }
  .leer { color: rgba(255, 255, 255, 0.6); font-size: 13px; }

  /* Der Übergang zur nächsten Folge */
  #weiter {
    position: fixed; right: 24px; bottom: 104px; width: min(340px, 84vw);
    padding: 16px 18px; border-radius: 16px; background: rgba(8, 11, 18, 0.94);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; gap: 8px;
  }
  .weiterText { font-weight: 700; }
  .weiterTitel { color: rgba(255, 255, 255, 0.7); font-size: 13px; }
  .weiterKnoepfe { display: flex; gap: 8px; margin-top: 4px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="buehne">
    <video id="bild" playsinline preload="metadata"></video>
  </div>

  <div id="mitte">
    <!-- Der Knopf in der Mitte. Er tut dasselbe wie der in der Leiste und ist
         dort, wo der Blick ohnehin hinsieht - und wo die Maus schon steht. -->
    <button id="mitteSpielen" type="button" title="Abspielen (Leertaste)">▶</button>
    <div id="puffer"></div>
    <div id="warteAufAlle" hidden>Warten auf alle …</div>
    <div id="fehler" hidden>
      <h2 id="fehlerTitel">Die Quelle spielt nicht</h2>
      <p id="fehlerText"></p>
      <button id="zurueckZumHoster" type="button">Andere Folge oder anderen Hoster wählen</button>
    </div>
  </div>

  <!-- Wer sonst noch bei dieser Folge sitzt. Leer, solange man allein ist. -->
  <div id="runde" hidden></div>
  <div id="spulVorschau" role="tooltip" hidden>
    <canvas id="spulVorschauBild" width="240" height="135" hidden></canvas>
    <span id="spulVorschauText"></span>
  </div>

  <div id="kopf" class="schicht">
    <div>
      <div id="titel">Wiedergabe</div>
      <div id="hoster"></div>
    </div>
    <button id="zu" type="button" title="Schließen (Esc)">Schließen</button>
  </div>

  <div id="leiste" class="schicht">
    <div class="reihe">
      <span id="stelle" class="zeit">0:00</span>
      <input id="regler" type="range" min="0" max="1000" value="0" step="1" aria-label="Wiedergabeposition">
      <span id="dauer" class="zeit">0:00</span>
    </div>
    <div class="reihe">
      <button id="spielen" type="button" title="Abspielen (Leertaste)">▶</button>
      <button id="zurueck" type="button" title="10 Sekunden zurück">−10 s</button>
      <button id="vor" type="button" title="10 Sekunden vor">+10 s</button>
      <button id="ton" type="button" title="Ton aus (M)">🔊</button>
      <input id="lautstaerke" type="range" min="0" max="100" value="100" step="1" aria-label="Lautstärke">
      <button id="marke" type="button" class="betont" hidden title="Intro überspringen">Intro überspringen</button>
      <span class="luecke"></span>
      <button id="folgenKnopf" type="button" title="Staffeln und Folgen (E)">Folgen</button>
      <!-- Fuenf Auswahlfelder, und keines davon ist ein <select>. Warum, steht
           bei der Klasse Wahl in spieler.js: das aufgeklappte Menue eines
           <select> ist ein Fenster des Systems, und in einer WebContentsView
           war es mit der Maus nicht zu treffen und mit einer Fernbedienung
           ueberhaupt nicht. Diese hier gehoeren der Seite. -->
      <div class="wahl" id="fassungWahl" hidden></div>
      <div class="wahl" id="hosterWahl"></div>
      <div class="wahl" id="untertitel" hidden></div>
      <div class="wahl" id="stufen"></div>
      <!-- Das Tempo. In einer Runde gehoert es dem Host: er stellt es fuer
           alle, und bei den anderen steht es dann nur noch da. -->
      <div class="wahl" id="tempo"></div>
      <!-- Ab hier geht es um die naechste Folge und nicht mehr um diese. Der
           Strich davor ist kein Schmuck: links davon stehen vier Auswahlfelder,
           und eines davon bietet "Automatisch" an. Ohne Trennung standen
           "Automatisch" und der Autoplay-Schalter direkt nebeneinander und
           erklaerten einander gegenseitig weg. -->
      <span class="trenner" aria-hidden="true"></span>
      <!-- Der Autoplay-Schalter gehoert in die Leiste und nicht in den
           Uebergangskasten: der steht nur da, wenn Autoplay an ist - man
           koennte es dort ausschalten und nie wieder ein. -->
      <button id="autoKnopf" type="button" title="Nächste Folge von selbst starten">Autoplay an</button>
      <button id="miniKnopf" type="button" title="Mini-Player öffnen" aria-pressed="false" hidden>Mini-Player</button>
      <button id="gross" type="button" title="Vollbild (F)">⛶</button>
    </div>
  </div>

  <button id="chatKnopf" type="button" aria-label="Watchparty-Chat öffnen" aria-expanded="false" aria-controls="chatPanel" title="Watchparty-Chat öffnen">›</button>
  <aside id="chatPanel" hidden aria-label="Livechat">
    <div class="chatKopf">
      <strong>Livechat</strong>
      <button id="chatZu" type="button" title="Chat schließen">✕</button>
    </div>
    <div id="chatStatus" aria-live="polite"></div>
    <div id="chatListe" aria-live="polite" aria-relevant="additions text"></div>
    <form id="chatForm">
      <textarea id="chatEingabe" rows="1" maxlength="500" placeholder="Nachricht schreiben" aria-label="Chatnachricht"></textarea>
      <button id="chatSenden" type="submit">Senden</button>
    </form>
  </aside>

  <!-- Die Folgenliste. Sie liegt ueber dem Bild und nicht daneben: der Player
       fuellt die Flaeche, und eine Spalte daneben haette den Film verkleinert. -->
  <div id="folgenPanel" hidden>
    <div class="panelKopf">
      <strong id="folgenTitel">Folgen</strong>
      <button id="folgenZu" type="button" title="Schließen">✕</button>
    </div>
    <div id="staffelReiter" class="reiter"></div>
    <div class="staffelAktion">
      <button id="staffelGesehen" type="button">Ganze Staffel als gesehen</button>
      <button id="staffelUngesehen" type="button">Zurücknehmen</button>
    </div>
    <div id="folgenListe" class="liste"></div>
    <div id="folgenLeer" class="leer" hidden>Die Folgenliste ließ sich nicht lesen.</div>
    <!-- Die drei Schalter des Spoiler-Schutzes. Sie stehen hier, weil hier
         auffaellt, dass zu viel verdeckt ist - eingeklappt, damit sie die
         Folgenliste nicht verdraengen. -->
    <details id="spoilerSchutzBox" class="spoilerBox">
      <summary>Spoiler-Schutz</summary>
      <label class="spoilerZeile">
        <input id="spoilerEnabled" type="checkbox">
        <span><strong>Spoiler-Schutz aktivieren</strong>
          <small>ELFIX blendet Hinweise auf spätere Folgen aus, solange du sie noch nicht gesehen hast.</small></span>
      </label>
      <label class="spoilerZeile">
        <input id="spoilerRoomMinimum" type="checkbox">
        <span><strong>Im Raum den gemeinsamen Mindeststand verwenden</strong>
          <small>Relevant für Watchpartys. ELFIX schaut, wie weit alle aktuell Mitschauenden sind. Eine Folge gilt für den Spoilerschutz erst als gesehen, wenn jeder in der Runde sie bereits gesehen hat.<br>
          Beispiel: Du bis Folge 10, Freund A bis Folge 8, Freund B bis Folge 6 → gemeinsamer Stand = Folge 6. Details ab Folge 7 werden geschützt.</small></span>
      </label>
      <label class="spoilerZeile">
        <input id="spoilerShare" type="checkbox">
        <span><strong>Gesehene Folgen mit der Runde teilen</strong>
          <small>Damit erlaubst du anderen in der Watchparty, deinen gesehenen Stand für diesen gemeinsam geöffneten Titel zu berücksichtigen.<br>
          Aus: Die Runde weiß nicht, welche Folgen du schon gesehen hast. An: Dein Stand kann für den gemeinsamen Spoilerschutz verwendet werden.</small></span>
      </label>
    </details>
  </div>

  <!-- Der Übergang zur nächsten Folge. Er zählt sichtbar herunter, damit ein
       Abbruch möglich bleibt - wer den Abspann sehen will, soll ihn sehen. -->
  <!-- Die Karte zur naechsten Folge.
       Sie sitzt ueber der Leiste rechts und gehoert zu den Schichten: sie geht
       mit ihnen weg, wenn nichts geschieht, und kommt mit ihnen zurueck, sobald
       die Maus sich regt. Ein Knopf, der ueber einem laufenden Film dauerhaft
       stehenbleibt, stoert genau so wie eine Leiste. -->
  <button id="weiterKnopf" type="button" hidden title="Nächste Folge (N)">
    <span class="weiterKnopfOben">Nächste Folge</span>
    <span class="weiterKnopfTitel" id="weiterKnopfTitel"></span>
  </button>

  <div id="weiter" hidden>
    <div class="weiterText">Nächste Folge in <span id="weiterZahl">8</span> s</div>
    <div class="weiterTitel" id="weiterTitel"></div>
    <div class="weiterKnoepfe">
      <button id="weiterJetzt" type="button" class="betont">Jetzt</button>
      <button id="weiterAbbruch" type="button">Abbrechen</button>
      <!-- "Abbrechen" haelt diesen einen Zaehler an; "Danach aufhören" gilt
           fuer die ganze Folge und ist danach wieder weg. Zwei verschiedene
           Dinge, deshalb zwei Knoepfe. -->
      <button id="weiterSchluss" type="button">Danach aufhören</button>
    </div>
  </div>

  <script src="../../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="spieler-chat.js"></script>
  <script src="../skipsegmente.js"></script>
  <script src="../untertitelwahl.js"></script>
  <script src="spieler-vorschau.js"></script>
  <script src="spieler.js"></script>
</body>
</html>
